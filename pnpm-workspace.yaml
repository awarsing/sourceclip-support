packages: []

nodeLinker: isolated
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
blockExoticSubdeps: true
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
verifyDepsBeforeRun: warn
engineStrict: true

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': false
  esbuild: true
  prisma: false
  sharp: true
  unrs-resolver: true
  vue-demi: true

overrides:
  # 3.8.2 and later lack the provenance earlier releases had (trust downgrade).
  '@vercel/oidc': 3.8.1
  esbuild@<=0.24.2: ^0.25.12
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  sharp@<0.35.5: ^0.35.5
  '@modelcontextprotocol/server@>=2.0.0 <2.3.0': ^2.3.0
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  markdown-it@<14.3.3: ^14.3.3
  serialize-javascript@<7.1.3: ^7.1.3
  undici@>=6.5.0 <6.29.1: ^6.29.1
  undici@>=7.0.0 <7.30.1: ^7.30.1
  undici@>=8.0.0 <8.12.2: ^8.12.2
  zod@>=4.0.0 <4.6.6: ^4.6.6
