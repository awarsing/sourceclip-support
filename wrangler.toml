name = "sourceclip-support"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

# SourceClip support surface custom domain.
routes = [
  { pattern = "support.sourceclip.app", custom_domain = true }
]

# Bundle the Drizzle migrations folder into the Worker as Text modules so
# runtime-migrate can read `.sql` files and `meta/_journal.json` via
# node:fs under /bundle/... at request time. Combined with nuxt.config.ts's
# nitro.unenv.external for node:fs, this is what lets the /setup page run
# migrations on the very first request after deploy.
#
# Newer Workers runtimes (compatibility_date >= 2026-01-20) ship with a
# built-in `.sql` Text rule, but older wrangler CLIs fall back to an
# earlier runtime that lacks it — declaring both globs explicitly keeps
# the same behavior across wrangler versions.
find_additional_modules = true

[[rules]]
type = "Text"
globs = ["**/*.sql", "**/_journal.json"]
fallthrough = true

# Nuxt/Nitro cloudflare-module emits a wasm module (xxhash) referenced from
# the server chunk; declare it so wrangler bundles it into the Worker.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

# Hyperdrive accelerates the external PostgreSQL (Neon) connection for
# SourceClip support. Config id created under the Three Things Media account.
[[hyperdrive]]
binding = "POSTGRES"
id = "357834a5927f419aa1bdc981724a59de"

# R2 bucket for blob storage (file uploads), separate from the SourceClip
# library bucket.
[[r2_buckets]]
binding = "BLOB"
bucket_name = "sourceclip-support"

# Public (non-secret) configuration.
# Secrets (BETTER_AUTH_SECRET, SYSTEM_ADMIN_EMAILS, GOOGLE_CLIENT_SECRET,
# OPENAI_API_KEY, etc.) must be set via `wrangler secret put <NAME>` or via
# the Deploy Button form (backed by .dev.vars.example), NOT declared here.
[vars]
BETTER_AUTH_URL = "https://support.sourceclip.app"
AUTH_EMAIL_ENABLED = "true"
AUTH_EMAIL_VERIFY = "true"
EMAIL_FROM = "SourceClip <noreply@sourceclip.app>"
# GOOGLE_CLIENT_ID is set as a Worker secret (see below).

# Secrets to configure via `wrangler secret put` (manual-deploy path):
#   wrangler secret put BETTER_AUTH_SECRET       # random 32+ char string
#   wrangler secret put SYSTEM_ADMIN_EMAILS      # e.g. you@example.com
#   wrangler secret put GOOGLE_CLIENT_SECRET     # if enabling Google OAuth
#   wrangler secret put OPENAI_API_KEY           # if enabling AI features

[observability]
[observability.logs]
enabled = false
invocation_logs = true

[placement]
mode = "smart"

# Daily recovery; delayed messages invoke the shared queue consumer.
[triggers]
crons = ["0 3 * * *"]

[[queues.producers]]
binding = "INBOX_QUEUE"
queue = "sourceclip-support-inbox"

[[queues.consumers]]
queue = "sourceclip-support-inbox"
max_batch_size = 1
max_retries = 3
retry_delay = 60
